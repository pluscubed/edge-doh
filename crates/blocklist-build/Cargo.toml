[package]
name = "blocklist-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Offline blocklist artifact builder."
license.workspace = true

[dependencies]
anyhow = "1.0.100"
blocklist-core = { path = "../blocklist-core", features = ["build"] }
clap = { version = "4.5.53", features = ["derive"] }
env_logger = "0.11.8"
hex = "0.4.3"
log = "0.4.29"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "gzip", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
toml = "0.9.8"

[lints]
workspace = true
